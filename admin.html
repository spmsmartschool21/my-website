<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Portal | SPM Smart School</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#064e3b">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
       
        /* Unique Emerald Green Theme for Administrative Portal */
        body {
            background: linear-gradient(135deg, #022c22 0%, #064e3b 50%, #022c22 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .portal-wrapper {
            width: 100%;
            max-width: 440px;
            background: rgba(6, 78, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(251, 191, 36, 0.25);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .school-logo-box {
            width: 70px;
            height: 70px;
            margin: 0 auto 15px;
            background: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #fbbf24;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .school-logo-box img {
            width: 50px;
            height: 50px;
            object-fit: contain;
        }

        .portal-wrapper h2 {
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 5px;
        }

        .portal-wrapper p.subtitle {
            font-size: 0.78rem;
            color: #fbbf24;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
            margin-bottom: 30px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            color: #cbd5e1;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .input-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-container input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            background: rgba(2, 44, 34, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .input-container input:focus {
            border-color: #fbbf24;
            box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.2);
        }

        .input-icon {
            position: absolute;
            left: 12px;
            color: #94a3b8;
            font-size: 1rem;
        }

        .auth-btn {
            width: 100%;
            background: linear-gradient(135deg, #d97706 0%, #b45309 100%);
            color: #ffffff;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.2s, opacity 0.2s;
            box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3);
        }

        .auth-btn:hover {
            transform: translateY(-1px);
            opacity: 0.95;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.82rem;
            font-weight: 600;
            transition: color 0.3s;
        }

        .back-link:hover {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="portal-wrapper">
        <div class="school-logo-box">
            <img src="images/logo.png" alt="School Logo">
        </div>
        <h2>Management Portal</h2>
        <p class="subtitle">SPM Smart School Administration</p>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-container">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" placeholder="Enter administrator username" required>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-container">
                    <span class="input-icon">🔑</span>
                    <input type="password" id="password" placeholder="••••••••••••" required>
                </div>
            </div>

            <button type="submit" class="auth-btn">Authenticate</button>
        </form>

        <a href="index.html" class="back-link">&larr; Return to main website</a>
    </div>

<script>
    function handleLogin(e) {
        e.preventDefault();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();

        if (user === "admin" && pass === "spm2026") {
            // Automatically redirect to dashboard page upon success
            window.location.href = "dashboard.html";
        } else {
            alert("Invalid Username or Password! Please try again.");
        }
        return false;
    }
</script>

</body>
</html>

</body>
</html>
